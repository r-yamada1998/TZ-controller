[sis_bias_setter]
_ = "CPZ3346"
rsw_id = 0
channel = { v1 = "ch5", v2 = "ch8", h1 = "ch6", h2 = "ch7"}
ch_num_li = [5,6,7,8]
ave_num = 100
smpl_freq = 1000
# Bias setting [mV] -> DA output [V] = setting / (3 * 0.94), the bias box
# calibration. Without it the setting reaches the DA board unscaled and the
# junction sees 2.82 times the setting.
conversion_factor = 0.3546099290780142
range = { v1 = "10V", h1 = "10V", h2 = "10V", v2 = "10V" }
# Operating values from the IRR maps of 2026-10-27 [mV]
tuned = { v1 = 6.1, h1 = 7.2, h2 = 7.4, v2 = 6.1 }

[sis_bias_reader]
_ = "CPZ3177"
rsw_id = 0
all_ch_num = 8
# Wiring identified on the receiver on 2026-09-04, by sweeping one mixer at a
# time from 0 to 8 mV while recording all 16 AD channels as raw volts, and
# reading off which column moved.
# Adjacent pairs, odd = current monitor, even = voltage monitor:
#     v1 -> ch9  / ch10
#     h1 -> ch11 / ch12
#     h2 -> ch13 / ch14
#     v2 -> ch15 / ch16
#
# Registration order is readout order. The residue of the last channel in the
# list lands on the first one, so the voltage channels, which swing most, are
# never placed last.
channel = { v1_v = "ch10", v1 = "ch9", v2_v = "ch16", v2 = "ch15", h1_v = "ch12", h1 = "ch11", h2_v = "ch14", h2 = "ch13" }
ch_range = { v1_v = "5V", v1 = "5V", v2_v = "5V", v2 = "5V", h1_v = "5V", h1 = "5V", h2_v = "5V", h2 = "5V" }
ave_num = 10
smpl_freq = 1000
smpl_num = 15
single_diff = "DIFF"
# Voltage monitors -5 mV/V, current monitors -500 uA/V. The gains differ, so
# a single scalar cannot scale both.
conversion_factor = { v1_v = -5.0, v1 = -500, v2_v = -5.0, v2 = -500, h1_v = -5.0, h1 = -500, h2_v = -5.0, h2 = -500 }

[local_attenuator]
_ = "GPVDC15"
host = "192.168.223.102"

# GPIB port 4 = H, port 5 = V [mA]. A larger current attenuates more.
[local_attenuator.channels]
4 = { att_current = 27.0 }
5 = { att_current = 20.0 }


